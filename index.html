<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Design Systems Trends &mdash; 2026</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --teal:  #01949a;
    --red:   #db1f48;
    --blue:  #004369;
    --dark:  #1a1814;
    --med:   #46413a;
    --light: #f8f7f5;
  }

  /* ── Reveal base overrides ────────────────── */
  .reveal-viewport { background: #fff; }
  .reveal {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
  }
  .reveal .slides { text-align: left; }
  .reveal .slides > section,
  .reveal .slides > section > section {
    padding: 70px 90px 90px 90px;
    height: 100%;
    box-sizing: border-box;
  }
  .reveal h1, .reveal h2, .reveal h3, .reveal h4 {
    font-family: inherit;
    color: var(--dark);
    text-transform: none;
    letter-spacing: -0.02em;
    margin: 0 0 24px 0;
  }
  .reveal p { margin: 0 0 16px 0; }
  .reveal ul, .reveal ol { display: block; margin: 0; }
  .reveal a { color: var(--teal); text-decoration: none; }
  .reveal .controls { color: var(--teal); }
  .reveal .progress { color: var(--teal); }

  /* ── Decoration: stripe + footer ──────────── */
  .reveal .slides > section::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 180px; height: 14px;
    background: linear-gradient(
      90deg,
      var(--teal) 0%, var(--teal) 33%,
      var(--red) 33%, var(--red) 66%,
      var(--blue) 66%, var(--blue) 100%
    );
    z-index: 5;
  }
  .footer {
    position: absolute;
    left: 90px; right: 90px; bottom: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--med);
    z-index: 4;
  }
  .footer .url { color: var(--teal); font-weight: 500; letter-spacing: 0.01em; }
  .footer .mark { font-weight: 600; color: var(--med); letter-spacing: 0.06em; text-transform: uppercase; }

  /* ── Typography scale ─────────────────────── */
  .reveal .slide-title {
    font-size: 42px;
    line-height: 1.1;
    font-weight: 700;
  }
  .reveal .eyebrow {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 16px;
  }
  .reveal .lede {
    font-size: 22px;
    line-height: 1.45;
    font-weight: 400;
    color: var(--med);
    max-width: 900px;
  }

  /* ── Cover ────────────────────────────────── */
  .reveal section.cover { display: flex; flex-direction: column; justify-content: center; }
  .reveal .cover-eyebrow {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 18px;
  }
  .reveal .cover-title {
    font-size: 84px;
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--dark);
    margin: 0 0 28px 0;
  }
  .reveal .cover-title .accent { color: var(--teal); }
  .reveal .cover-tagline {
    font-size: 26px;
    line-height: 1.4;
    font-weight: 400;
    color: var(--med);
    max-width: 820px;
  }
  .reveal .cover-meta {
    margin-top: 36px;
    font-size: 16px;
    color: var(--med);
    letter-spacing: 0.04em;
  }
  .reveal .cover-meta strong { color: var(--dark); font-weight: 600; }

  /* ── Statement ────────────────────────────── */
  .reveal .statement {
    font-size: 44px;
    line-height: 1.18;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--dark);
    max-width: 1000px;
    margin: 60px 0 32px 0;
  }
  .reveal .statement-details p {
    font-size: 20px;
    line-height: 1.5;
    color: var(--med);
    padding-left: 18px;
    border-left: 3px solid var(--teal);
    margin: 0 0 12px 0;
    max-width: 820px;
  }

  /* ── Trend cards grid ─────────────────────── */
  .reveal .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-top: 32px;
  }
  .reveal .card {
    background: var(--light);
    border-radius: 14px;
    padding: 22px 24px;
    border-left: 4px solid var(--teal);
  }
  .reveal .card.b { border-left-color: var(--blue); }
  .reveal .card.r { border-left-color: var(--red); }
  .reveal .card .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: 0.08em;
  }
  .reveal .card.b .num { color: var(--blue); }
  .reveal .card.r .num { color: var(--red); }
  .reveal .card h3 {
    font-size: 22px;
    font-weight: 700;
    margin: 8px 0 10px 0;
  }
  .reveal .card p {
    font-size: 15px;
    line-height: 1.45;
    color: var(--med);
    margin: 0;
  }

  /* ── Comparison ───────────────────────────── */
  .reveal .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 28px;
  }
  .reveal .compare > div {
    border-radius: 14px;
    padding: 26px 28px;
  }
  .reveal .compare .then {
    background: rgba(219,31,72,0.05);
    border-top: 4px solid var(--red);
  }
  .reveal .compare .now {
    background: rgba(1,148,154,0.06);
    border-top: 4px solid var(--teal);
  }
  .reveal .compare h3 {
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 14px 0;
  }
  .reveal .compare .then h3 { color: var(--red); }
  .reveal .compare .now  h3 { color: var(--teal); }
  .reveal .compare ul { list-style: none; padding: 0; }
  .reveal .compare li {
    font-size: 18px;
    line-height: 1.45;
    color: var(--dark);
    padding: 10px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .reveal .compare li:last-child { border-bottom: none; }

  /* ── Bullet list ──────────────────────────── */
  .reveal ul.dotted { list-style: none; padding: 0; margin: 18px 0 0 0; max-width: 900px; }
  .reveal ul.dotted li {
    font-size: 22px;
    line-height: 1.5;
    font-weight: 500;
    color: var(--dark);
    padding: 8px 0 8px 26px;
    position: relative;
  }
  .reveal ul.dotted li::before {
    content: "";
    position: absolute; left: 0; top: 0.65em;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--teal);
  }

  /* ── Closing ──────────────────────────────── */
  .reveal section.closing {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .reveal .closing-title {
    font-size: 60px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 24px 0;
  }
  .reveal .closing-title .accent { color: var(--teal); }
  .reveal .closing-sub {
    font-size: 22px;
    color: var(--med);
    max-width: 720px;
    margin: 0 0 40px 0;
  }
  .reveal .closing-contact {
    font-size: 18px;
    color: var(--dark);
    font-weight: 600;
  }
  .reveal .closing-contact a { color: var(--teal); font-weight: 500; }
</style>
</head>
<body>

<div class="reveal">
  <div class="slides">
    <section
      data-markdown="slides.md"
      data-separator="^\r?\n---\r?\n$"
      data-separator-notes="^Note:">
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    controls: true,
    progress: true,
    slideNumber: false,
    width: 1280,
    height: 800,
    margin: 0.04,
    minScale: 0.2,
    maxScale: 2.0,
    transition: 'slide',
    transitionSpeed: 'default',
    plugins: [ RevealMarkdown ]
  });
</script>
</body>
</html>
